<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="二维码解析">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>POLYUNION 二维码解析 V0.8</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #edf2f7;
      --panel: #fff;
      --ink: #111827;
      --muted: #64748b;
      --line: #d8e0e9;
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --good: #168447;
      --warn: #b45309;
      --bad: #b42318;
      --purple: #6941c6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    }

    body.modal-open {
      overflow: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      padding: 10px 13px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .46;
      cursor: default;
    }

    .app {
      width: min(1150px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px 10px;
    }

    h1 {
      flex: 1;
      margin: 0;
      font-size: clamp(24px, 5vw, 35px);
      line-height: 1.14;
    }

    .engine-badge {
      flex: none;
      max-width: 48%;
      border-radius: 999px;
      padding: 7px 10px;
      background: #e7f7ed;
      color: #116b38;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
    }

    .version {
      margin: -4px 2px 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, .94fr) minmax(360px, 1.06fr);
      gap: 12px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 9px 30px rgba(15, 23, 42, .08);
    }

    .camera-panel {
      display: flex;
      min-height: 590px;
      flex-direction: column;
    }

    .camera-box {
      position: relative;
      min-height: 390px;
      flex: 1;
      overflow: hidden;
      background: #03060a;
    }

    video, .preview-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #03060a;
    }

    .preview-image {
      position: absolute;
      inset: 0;
      display: none;
    }

    .scan-frame {
      position: absolute;
      width: min(76%, 470px);
      aspect-ratio: 1 / 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.31);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 48px;
      height: 48px;
      border-color: #fff;
      border-style: solid;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.8));
    }

    .corner.tl { left: 0; top: 0; border-width: 5px 0 0 5px; }
    .corner.tr { right: 0; top: 0; border-width: 5px 5px 0 0; }
    .corner.bl { left: 0; bottom: 0; border-width: 0 0 5px 5px; }
    .corner.br { right: 0; bottom: 0; border-width: 0 5px 5px 0; }

    .frame-hint {
      position: absolute;
      left: 50%;
      bottom: -42px;
      transform: translateX(-50%);
      white-space: nowrap;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      text-shadow: 0 1px 4px #000;
    }

    .camera-state {
      position: absolute;
      left: 12px;
      top: 12px;
      max-width: calc(100% - 24px);
      border-radius: 999px;
      padding: 8px 12px;
      color: #fff;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
    }

    .primary { color: #fff; background: var(--primary); }
    .primary:active { background: var(--primary-dark); }
    .secondary { color: #253045; background: #edf2f7; }
    .deep { color: #fff; background: var(--purple); }
    .danger { color: var(--bad); background: #fff0ee; }

    .file-label {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      padding: 10px 13px;
      color: #fff;
      background: #7c3aed;
      font-weight: 850;
      text-align: center;
      cursor: pointer;
    }

    .file-label input {
      display: none;
    }

    .status {
      min-height: 48px;
      margin: 0 10px 10px;
      display: flex;
      align-items: center;
      border-radius: 12px;
      padding: 10px 12px;
      color: #334155;
      background: #f5f7fa;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.good { color: var(--good); background: #eaf8ef; }
    .status.warn { color: var(--warn); background: #fff7e7; }
    .status.bad { color: var(--bad); background: #fff0ee; }

    .progress-wrap {
      display: none;
      margin: 0 10px 11px;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5eaf0;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1565c0, #7c3aed);
      transition: width .15s ease;
    }

    .progress-label {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .result-panel {
      min-height: 590px;
      padding: 14px;
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 9px;
    }

    .result-head h2 {
      flex: 1;
      margin: 0;
      font-size: 24px;
    }

    .rows {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .field, .value {
      min-width: 0;
      padding: 11px 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .field {
      color: #334155;
      background: #f7f9fb;
      font-weight: 850;
    }

    .value {
      user-select: text;
      -webkit-user-select: text;
    }

    .raw-title {
      margin: 15px 0 7px;
      font-size: 17px;
      font-weight: 850;
    }

    .raw {
      min-height: 90px;
      max-height: 230px;
      overflow: auto;
      margin: 0;
      border-radius: 12px;
      padding: 11px 12px;
      color: #334155;
      background: #f6f8fa;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(9px, env(safe-area-inset-top))
        max(9px, env(safe-area-inset-right))
        max(9px, env(safe-area-inset-bottom))
        max(9px, env(safe-area-inset-left));
      background: rgba(5, 10, 20, .75);
      backdrop-filter: blur(9px);
    }

    .result-overlay.show {
      display: flex;
    }

    .outcome-card {
      width: min(760px, 100%);
      max-height: 94dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }

    .outcome-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .outcome-icon {
      width: 50px;
      height: 50px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: 29px;
      font-weight: 900;
    }

    .outcome-card.success .outcome-icon { background: var(--good); }
    .outcome-card.failure .outcome-icon { background: var(--bad); }

    .outcome-heading {
      min-width: 0;
      flex: 1;
    }

    .outcome-heading h2 {
      margin: 0;
      font-size: 25px;
    }

    .outcome-message {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .outcome-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px 4px;
      -webkit-overflow-scrolling: touch;
    }

    .outcome-actions {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 11px 12px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .camera-panel, .result-panel {
        min-height: auto;
      }

      .camera-box {
        min-height: min(108vw, 610px);
      }
    }

    @media (max-width: 600px) {
      .result-overlay {
        align-items: stretch;
        padding: 0;
      }

      .outcome-card {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
      }

      .outcome-head {
        padding: max(16px, env(safe-area-inset-top)) 14px 12px;
      }

      .outcome-scroll {
        padding: 10px 10px 4px;
      }

      .outcome-actions {
        grid-template-columns: 1fr 1fr;
      }

      .outcome-actions .copy-outcome {
        grid-column: 1 / -1;
        order: -1;
      }
    }

    @media (max-width: 450px) {
      .row {
        grid-template-columns: 97px minmax(0, 1fr);
      }

      .field, .value {
        padding: 10px 9px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <h1>POLYUNION 二维码解析</h1>
    <div id="engineBadge" class="engine-badge">正在加载本地C++引擎</div>
  </header>
  <div class="version">网页版 V0.8 · 启动卡死修复 · OpenCV按需加载</div>

  <main class="layout">
    <section class="panel camera-panel">
      <div class="camera-box">
        <video id="video" muted playsinline></video>
        <img id="previewImage" class="preview-image" alt="所选图片预览">

        <div class="scan-frame">
          <i class="corner tl"></i>
          <i class="corner tr"></i>
          <i class="corner bl"></i>
          <i class="corner br"></i>
          <div class="frame-hint">二维码尽量占满方框，保留四周白边</div>
        </div>

        <div id="cameraState" class="camera-state">等待启动</div>
      </div>

      <div class="controls">
        <button id="startButton" class="primary">开始扫描</button>
        <button id="stopButton" class="secondary" disabled>停止摄像头</button>
        <button id="deepButton" class="deep" disabled>立即深度识别</button>

        <label class="file-label">
          选择相册图片
          <input id="fileInput" type="file" accept="image/*">
        </label>

        <button id="torchButton" class="secondary" disabled>手电筒</button>
        <button id="copyButton" class="secondary">复制结果</button>
        <button id="clearButton" class="danger">清空</button>
      </div>

      <div id="status" class="status">识别引擎从本网站仓库本地加载。首次部署需先让GitHub Actions准备本地引擎文件。</div>

      <div id="progressWrap" class="progress-wrap">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="progressLabel" class="progress-label"></div>
      </div>
    </section>

    <section class="panel result-panel">
      <div class="result-head">
        <h2>字段结果</h2>
        <button id="continueButton" class="secondary" disabled>继续扫描</button>
      </div>

      <div id="rows" class="rows"></div>
      <div class="raw-title">二维码原始内容</div>
      <pre id="rawText" class="raw">等待扫描……</pre>
      <div class="note">
        自动模式先连续抓取高清画面并选择最清楚的一帧，再自动进入深度识别。
        深度模式会按桌面成功版的顺序尝试候选区域、透视校正、灰度、红通道、CLAHE、Otsu和多组阈值。
      </div>
    </section>
  </main>
</div>

<div id="resultOverlay" class="result-overlay" aria-hidden="true">
  <section id="outcomeCard" class="outcome-card success" role="dialog" aria-modal="true">
    <header class="outcome-head">
      <div id="outcomeIcon" class="outcome-icon">✓</div>
      <div class="outcome-heading">
        <h2 id="outcomeTitle">识别成功</h2>
        <p id="outcomeMessage" class="outcome-message"></p>
      </div>
    </header>

    <div class="outcome-scroll">
      <div id="outcomeRows" class="rows"></div>
      <div id="outcomeRawTitle" class="raw-title">二维码原始内容</div>
      <pre id="outcomeRaw" class="raw"></pre>
    </div>

    <footer class="outcome-actions">
      <button id="outcomeCopyButton" class="secondary copy-outcome">复制结果</button>
      <button id="outcomeCloseButton" class="secondary">查看结果</button>
      <button id="outcomeContinueButton" class="primary">继续扫描</button>
    </footer>
  </section>
</div>

<script src="./vendor/zxing/index.js"></script>
<script>
(() => {
  "use strict";

  const EXPECTED_KEYS = [
    "工作单号", "序号", "制令单号", "客户代号",
    "排单日期", "品名规格", "颜色", "烫带说明"
  ];

  const ZXING_OPTIONS_LOCAL = {
    formats: ["QRCode"],
    tryHarder: true,
    tryRotate: true,
    tryInvert: true,
    tryDownscale: true,
    tryDenoise: true,
    downscaleFactor: 2,
    downscaleThreshold: 900,
    maxNumberOfSymbols: 1,
    returnErrors: false,
    characterSet: "GB18030",
    textMode: "Plain",
    binarizer: "LocalAverage"
  };

  const ZXING_OPTIONS_GLOBAL = {
    ...ZXING_OPTIONS_LOCAL,
    tryDownscale: false,
    binarizer: "GlobalHistogram"
  };

  const video = document.getElementById("video");
  const previewImage = document.getElementById("previewImage");
  const startButton = document.getElementById("startButton");
  const stopButton = document.getElementById("stopButton");
  const deepButton = document.getElementById("deepButton");
  const torchButton = document.getElementById("torchButton");
  const copyButton = document.getElementById("copyButton");
  const clearButton = document.getElementById("clearButton");
  const continueButton = document.getElementById("continueButton");
  const fileInput = document.getElementById("fileInput");
  const engineBadge = document.getElementById("engineBadge");
  const cameraState = document.getElementById("cameraState");
  const status = document.getElementById("status");
  const rows = document.getElementById("rows");
  const rawText = document.getElementById("rawText");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");

  const resultOverlay = document.getElementById("resultOverlay");
  const outcomeCard = document.getElementById("outcomeCard");
  const outcomeIcon = document.getElementById("outcomeIcon");
  const outcomeTitle = document.getElementById("outcomeTitle");
  const outcomeMessage = document.getElementById("outcomeMessage");
  const outcomeRows = document.getElementById("outcomeRows");
  const outcomeRawTitle = document.getElementById("outcomeRawTitle");
  const outcomeRaw = document.getElementById("outcomeRaw");
  const outcomeCopyButton = document.getElementById("outcomeCopyButton");
  const outcomeCloseButton = document.getElementById("outcomeCloseButton");
  const outcomeContinueButton = document.getElementById("outcomeContinueButton");

  let engineReadyPromise = null;
  let openCvPromise = null;
  let cameraStream = null;
  let cameraTrack = null;
  let scanTimer = null;
  let scanRoundStartedAt = 0;
  let frameCount = 0;
  let frameBusy = false;
  let scanning = false;
  let torchOn = false;
  let bestFrameCanvas = null;
  let bestSharpness = -1;
  let currentCopyText = "";
  let lastDecodedText = "";
  let lastDecodedAt = 0;
  let abortToken = 0;
  let cameraStarting = false;

  showWaiting();
  prewarmEngine();

  // Do not preload OpenCV.js during page startup.
  // On iPhone Safari the locally cached OpenCV file can be parsed immediately
  // and occupy the main UI thread for several seconds, making every button
  // appear frozen. It is now loaded only when deep decoding actually needs it.

  function setStatus(message, type = "") {
    status.textContent = message;
    status.className = "status" + (type ? " " + type : "");
  }

  function setProgress(visible, percent = 0, label = "") {
    progressWrap.style.display = visible ? "block" : "none";
    progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
    progressLabel.textContent = label;
  }

  async function prewarmEngine() {
    if (engineReadyPromise) return engineReadyPromise;

    engineReadyPromise = (async () => {
      if (!window.ZXingWASM?.readBarcodes) {
        throw new Error("本地ZXing-C++文件尚未准备。请在GitHub Actions运行“Prepare local scanner engines”后刷新页面。");
      }

      engineBadge.textContent = "正在初始化C++引擎";
      setStatus("正在下载并初始化ZXing-C++ WebAssembly识别引擎……");

      if (typeof ZXingWASM.prepareZXingModule === "function") {
        const localWasmUrl = new URL(
          "./vendor/zxing/zxing_reader.wasm",
          window.location.href
        ).href;

        await ZXingWASM.prepareZXingModule({
          overrides: {
            locateFile(path, prefix) {
              if (path.endsWith(".wasm")) return localWasmUrl;
              return prefix + path;
            }
          },
          fireImmediately: true
        });
      }

      engineBadge.textContent = "本地ZXing-C++已就绪";
      setStatus("本地ZXing-C++已就绪，可以立即开始扫描；OpenCV仅在深度识别时按需加载。", "good");
      return true;
    })().catch(error => {
      engineBadge.textContent = "C++引擎加载失败";
      setStatus("识别引擎加载失败：" + safeMessage(error), "bad");
      engineReadyPromise = null;
      throw error;
    });

    return engineReadyPromise;
  }

  function preloadOpenCv() {
    if (openCvPromise) return openCvPromise;

    openCvPromise = new Promise((resolve, reject) => {
      if (window.cv?.Mat) {
        resolve(window.cv);
        return;
      }

      const oldModule = window.Module || {};
      const oldCallback = oldModule.onRuntimeInitialized;
      let settled = false;

      function finish() {
        if (settled) return;
        settled = true;
        if (window.cv?.Mat) {
          resolve(window.cv);
        } else {
          reject(new Error("OpenCV.js初始化后没有找到cv.Mat"));
        }
      }

      window.Module = {
        ...oldModule,
        locateFile(path, prefix) {
          if (path.endsWith(".wasm")) {
            return new URL(
              "./vendor/opencv/opencv_js.wasm",
              window.location.href
            ).href;
          }
          if (typeof oldModule.locateFile === "function") {
            return oldModule.locateFile(path, prefix);
          }
          return prefix + path;
        },
        onRuntimeInitialized() {
          try {
            if (typeof oldCallback === "function") oldCallback();
          } finally {
            finish();
          }
        }
      };

      const script = document.createElement("script");
      script.src = "./vendor/opencv/opencv.js";
      script.async = true;
      script.onload = async () => {
        try {
          if (window.cv && typeof window.cv.then === "function") {
            window.cv = await window.cv;
            finish();
          } else if (window.cv?.Mat) {
            finish();
          }
        } catch (error) {
          reject(error);
        }
      };
      script.onerror = () => reject(new Error("本地OpenCV.js文件尚未准备"));
      document.head.appendChild(script);

      setTimeout(() => {
        if (!settled && window.cv?.Mat) finish();
      }, 12000);
    }).catch(error => {
      console.warn("OpenCV.js unavailable:", error);
      openCvPromise = null;
      throw error;
    });

    return openCvPromise;
  }

  async function startCamera() {
    if (cameraStarting) return;
    cameraStarting = true;

    closeOutcome();
    clearBestFrame();
    abortToken++;
    const token = abortToken;

    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      cameraStarting = false;
      setStatus("摄像头必须通过HTTPS网址打开。", "bad");
      return;
    }

    try {
      await prewarmEngine();
      if (token !== abortToken) return;

      stopCamera(false);
      previewImage.style.display = "none";
      video.style.display = "block";
      setStatus("正在请求iPhone摄像头权限……");
      cameraState.textContent = "正在启动摄像头";

      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 3840 },
          height: { ideal: 2160 },
          frameRate: { ideal: 30, max: 30 }
        }
      });

      video.srcObject = cameraStream;
      video.setAttribute("playsinline", "true");
      await video.play();
      await waitForVideoReady();

      cameraTrack = cameraStream.getVideoTracks()[0] || null;
      await requestCameraOptimizations();

      scanning = true;
      frameBusy = false;
      frameCount = 0;
      bestSharpness = -1;
      scanRoundStartedAt = performance.now();

      updateCameraButtons(true);
      updateTorchAvailability();

      const resolution = `${video.videoWidth}×${video.videoHeight}`;
      cameraState.textContent = `摄像头运行中 · ${resolution}`;
      setStatus(
        "自动识别已开始：请让二维码占满白色方框，保留四周白边并保持不动。"
      );
      scheduleScan(180);
    } catch (error) {
      stopCamera(false);
      setStatus(cameraErrorText(error), "bad");
      cameraState.textContent = "摄像头启动失败";
    } finally {
      cameraStarting = false;
    }
  }

  async function requestCameraOptimizations() {
    if (!cameraTrack?.getCapabilities || !cameraTrack.applyConstraints) return;

    try {
      const capabilities = cameraTrack.getCapabilities();
      const advanced = [];

      if (Array.isArray(capabilities.focusMode) &&
          capabilities.focusMode.includes("continuous")) {
        advanced.push({ focusMode: "continuous" });
      }

      if (Array.isArray(capabilities.exposureMode) &&
          capabilities.exposureMode.includes("continuous")) {
        advanced.push({ exposureMode: "continuous" });
      }

      if (advanced.length) {
        await cameraTrack.applyConstraints({ advanced });
      }
    } catch (_) {}
  }

  function waitForVideoReady() {
    if (video.readyState >= 2 && video.videoWidth > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      const timeout = setTimeout(
        () => reject(new Error("摄像头画面初始化超时")),
        9000
      );

      const check = () => {
        if (video.videoWidth > 0) {
          clearTimeout(timeout);
          video.removeEventListener("loadedmetadata", check);
          resolve();
        }
      };
      video.addEventListener("loadedmetadata", check);
    });
  }

  function scheduleScan(delay = 420) {
    if (scanTimer) clearTimeout(scanTimer);
    if (!scanning) return;
    scanTimer = setTimeout(scanCameraFrame, delay);
  }

  async function scanCameraFrame() {
    if (!scanning || frameBusy || video.readyState < 2 || !video.videoWidth) {
      scheduleScan(260);
      return;
    }

    frameBusy = true;
    const token = abortToken;

    try {
      frameCount++;
      const fullFrame = captureVideoFrame(3000);
      const center = centerSquareCrop(fullFrame, 0.88, 1900);
      const sharpness = estimateSharpness(center);

      if (sharpness > bestSharpness) {
        clearBestFrame();
        bestFrameCanvas = cloneCanvas(fullFrame);
        bestSharpness = sharpness;
      }

      const fastVariants = buildFastVariants(center, frameCount);
      let hit = null;

      for (let i = 0; i < fastVariants.length; i++) {
        if (!scanning || token !== abortToken) break;
        hit = await decodeCanvasWasm(
          fastVariants[i].canvas,
          `${fastVariants[i].name} / 快速扫描`,
          i === 0
        );
        fastVariants[i].canvas.width = 1;
        fastVariants[i].canvas.height = 1;
        if (hit?.accepted) break;
      }

      center.width = 1;
      center.height = 1;
      fullFrame.width = 1;
      fullFrame.height = 1;

      if (hit?.accepted) {
        completeSuccess(hit, "摄像头快速扫描");
        return;
      }

      const elapsed = performance.now() - scanRoundStartedAt;
      setStatus(
        `正在选择最清楚画面：${frameCount}/5帧 · 清晰度${Math.round(bestSharpness)}。` +
        "保持二维码占满方框。"
      );

      if (frameCount >= 5 || elapsed >= 3200) {
        scanning = false;
        if (scanTimer) clearTimeout(scanTimer);
        setStatus("已取得最清楚的一帧，正在自动进行深度识别……");
        cameraState.textContent = "正在深度识别";
        await runDeepOnBestFrame(token, true);
        return;
      }
    } catch (error) {
      console.error(error);
      setStatus("实时识别异常：" + safeMessage(error), "warn");
    } finally {
      frameBusy = false;
      if (scanning) scheduleScan(380);
    }
  }

  async function runDeepOnBestFrame(token = abortToken, automatic = false) {
    if (!bestFrameCanvas) {
      if (!video.videoWidth) {
        showFailureOutcome("没有取得可识别的摄像头画面。");
        return;
      }
      bestFrameCanvas = captureVideoFrame(3200);
    }

    const source = cloneCanvas(bestFrameCanvas);
    stopCamera(false);
    setProgress(true, 2, "准备深度识别");

    try {
      const hit = await deepDecodeCanvas(source, token);
      source.width = 1;
      source.height = 1;

      if (token !== abortToken) return;

      setProgress(false);
      if (hit?.accepted) {
        completeSuccess(hit, automatic ? "自动深度识别" : "手动深度识别");
      } else {
        const reason = hit?.text
          ? "读取到二维码数据，但没有得到完整生产单字段。"
          : "本次画面没有读到有效二维码。";
        showFailureOutcome(
          reason + " 请把手机再靠近一点，等待对焦清楚后重新扫描。"
        );
      }
    } catch (error) {
      setProgress(false);
      showFailureOutcome("深度识别失败：" + safeMessage(error));
    } finally {
      clearBestFrame();
    }
  }

  async function deepDecodeCanvas(sourceCanvas, token) {
    const started = performance.now();
    const deadlineMs = 24000;
    let attempts = 0;
    let bestHit = null;

    const consider = hit => {
      if (!hit) return false;
      if (!bestHit || hit.score > bestHit.score) bestHit = hit;
      return hit.accepted;
    };

    const update = (message, percent) => {
      setProgress(true, percent, `${message} · 已尝试${attempts}次`);
    };

    // Step 1: same as the successful desktop flow: read the original first.
    update("直接读取原始高清画面", 4);
    attempts++;
    let hit = await decodeCanvasWasm(sourceCanvas, "原始高清画面", true);
    if (consider(hit)) return hit;

    if (isExpired(started, deadlineMs, token)) return bestHit;

    // Step 2: fast axis-aligned candidate regions.
    update("寻找高密度二维码区域", 9);
    const rects = findCandidateRects(sourceCanvas).slice(0, 8);

    for (let i = 0; i < rects.length; i++) {
      if (isExpired(started, deadlineMs, token)) return bestHit;

      const crop = cropCanvas(sourceCanvas, rects[i], 2100);
      const variants = buildGalleryVariants(crop);
      crop.width = 1;
      crop.height = 1;

      for (let v = 0; v < variants.length; v++) {
        if (isExpired(started, deadlineMs, token)) {
          recycleVariantList(variants);
          return bestHit;
        }

        attempts++;
        update(
          `候选区域${i + 1}/${rects.length} · ${variants[v].name}`,
          10 + Math.round(30 * (i + v / variants.length) / Math.max(1, rects.length))
        );

        hit = await decodeCanvasWasm(
          variants[v].canvas,
          `候选${i + 1} / ${variants[v].name}`,
          v === 0 || v === 4
        );
        variants[v].canvas.width = 1;
        variants[v].canvas.height = 1;

        if (consider(hit)) {
          recycleVariantList(variants);
          return hit;
        }
        await breathe();
      }
      recycleVariantList(variants);
    }

    if (isExpired(started, deadlineMs, token)) return bestHit;

    // Step 3: port of the successful Python/OpenCV perspective pipeline.
    update("按需加载OpenCV透视校正引擎，首次可能需要数秒", 42);
    let cvReady = false;
    try {
      await preloadOpenCv();
      cvReady = !!window.cv?.Mat;
    } catch (_) {
      cvReady = false;
    }

    if (!cvReady) return bestHit;

    try {
      const perspectiveHit = await deepDecodeWithOpenCv(
        sourceCanvas,
        token,
        started,
        deadlineMs,
        progress => {
          attempts = progress.attempts;
          update(progress.message, progress.percent);
        },
        consider
      );
      if (perspectiveHit?.accepted) return perspectiveHit;
      if (perspectiveHit && (!bestHit || perspectiveHit.score > bestHit.score)) {
        bestHit = perspectiveHit;
      }
    } catch (error) {
      console.warn("OpenCV deep decode error:", error);
    }

    return bestHit;
  }

  async function deepDecodeWithOpenCv(
    sourceCanvas,
    token,
    started,
    deadlineMs,
    onProgress,
    consider
  ) {
    const cv = window.cv;
    let src = null;
    let work = null;
    let scale = 1;
    let bestHit = null;
    let attempts = 0;

    try {
      src = cv.imread(sourceCanvas);
      const maxDimension = Math.max(src.cols, src.rows);

      if (maxDimension > 2200) {
        scale = 2200 / maxDimension;
        work = new cv.Mat();
        cv.resize(
          src,
          work,
          new cv.Size(Math.round(src.cols * scale), Math.round(src.rows * scale)),
          0,
          0,
          cv.INTER_AREA
        );
      } else {
        work = src.clone();
      }

      const quads = findOpenCvQuads(work, scale, sourceCanvas.width, sourceCanvas.height)
        .slice(0, 10);

      if (!quads.length) {
        quads.push({
          score: 1,
          points: [
            { x: 0, y: 0 },
            { x: sourceCanvas.width - 1, y: 0 },
            { x: sourceCanvas.width - 1, y: sourceCanvas.height - 1 },
            { x: 0, y: sourceCanvas.height - 1 }
          ]
        });
      }

      const expansions = [0, -0.003, 0.003, -0.008, 0.008];
      const sizes = [520, 650, 780];

      for (let qi = 0; qi < quads.length; qi++) {
        for (const expansion of expansions) {
          for (const size of sizes) {
            if (isExpired(started, deadlineMs, token)) return bestHit;

            const warped = warpQuadOpenCv(src, quads[qi].points, size, expansion);
            try {
              const variants = createOpenCvVariants(warped);

              for (let vi = 0; vi < variants.length; vi++) {
                if (isExpired(started, deadlineMs, token)) {
                  deleteOpenCvVariants(variants);
                  return bestHit;
                }

                attempts++;
                onProgress({
                  attempts,
                  percent: 45 + Math.min(
                    52,
                    Math.round(
                      52 * (
                        qi * expansions.length * sizes.length +
                        expansions.indexOf(expansion) * sizes.length +
                        sizes.indexOf(size)
                      ) /
                      Math.max(1, quads.length * expansions.length * sizes.length)
                    )
                  ),
                  message:
                    `透视候选${qi + 1}/${quads.length} · ${size}px · ` +
                    variants[vi].name
                });

                const imageData = matToBorderedImageData(variants[vi].mat, size);
                const hit = await decodeImageDataWasm(
                  imageData,
                  `透视校正：候选${qi + 1} / ${size}px / ${variants[vi].name}`,
                  vi === 0 || vi === 6
                );

                if (hit && (!bestHit || hit.score > bestHit.score)) bestHit = hit;
                if (consider(hit)) {
                  deleteOpenCvVariants(variants);
                  return hit;
                }
                await breathe();
              }

              deleteOpenCvVariants(variants);
            } finally {
              warped.delete();
            }
          }
        }
      }

      return bestHit;
    } finally {
      if (work) work.delete();
      if (src) src.delete();
    }
  }

  function findOpenCvQuads(work, scale, originalWidth, originalHeight) {
    const cv = window.cv;
    const gray = new cv.Mat();
    const channels = new cv.MatVector();
    const output = [];

    try {
      cv.cvtColor(work, gray, cv.COLOR_RGBA2GRAY);
      cv.split(work, channels);

      const channelList = [
        gray,
        channels.get(0), // red
        channels.get(1)  // green
      ];

      const minDimension = Math.min(work.rows, work.cols);
      let dynamicKernel = Math.max(3, Math.round(minDimension * 0.008));
      if (dynamicKernel % 2 === 0) dynamicKernel++;
      const kernels = [...new Set([3, 5, 7, 9, 13, 17, dynamicKernel])];

      for (const channel of channelList) {
        const otsuMat = new cv.Mat();
        const otsuValue = cv.threshold(
          channel,
          otsuMat,
          0,
          255,
          cv.THRESH_BINARY | cv.THRESH_OTSU
        );
        otsuMat.delete();

        const thresholds = [...new Set(
          [70, 85, 100, 115, 130, 145, 160, Math.round(otsuValue)]
        )].sort((a, b) => a - b);

        for (const threshold of thresholds) {
          const darkMask = new cv.Mat();
          cv.threshold(channel, darkMask, threshold, 255, cv.THRESH_BINARY_INV);

          for (const kernelSize of kernels) {
            const merged = new cv.Mat();
            const kernel = cv.Mat.ones(kernelSize, kernelSize, cv.CV_8U);
            cv.morphologyEx(darkMask, merged, cv.MORPH_CLOSE, kernel);
            kernel.delete();

            const contours = new cv.MatVector();
            const hierarchy = new cv.Mat();
            cv.findContours(
              merged,
              contours,
              hierarchy,
              cv.RETR_EXTERNAL,
              cv.CHAIN_APPROX_SIMPLE
            );

            const contourInfo = [];
            for (let i = 0; i < contours.size(); i++) {
              const contour = contours.get(i);
              const area = cv.contourArea(contour, false);
              contourInfo.push({ index: i, area });
              contour.delete();
            }
            contourInfo.sort((a, b) => b.area - a.area);

            for (const info of contourInfo.slice(0, 14)) {
              const contour = contours.get(info.index);
              try {
                const totalArea = work.rows * work.cols;
                if (info.area < totalArea * 0.003 || info.area > totalArea * 0.82) {
                  continue;
                }

                const rect = cv.boundingRect(contour);
                const ratio = rect.width / Math.max(1, rect.height);
                if (ratio < 0.48 || ratio > 2.05) continue;

                const perimeter = cv.arcLength(contour, true);
                let points = null;

                for (const epsilonFactor of [0.012, 0.018, 0.025, 0.035, 0.05, 0.07]) {
                  const approx = new cv.Mat();
                  cv.approxPolyDP(contour, approx, epsilonFactor * perimeter, true);

                  if (approx.rows === 4 && cv.isContourConvex(approx)) {
                    points = pointsFromContour(approx);
                    approx.delete();
                    break;
                  }
                  approx.delete();
                }

                if (!points) {
                  points = [
                    { x: rect.x, y: rect.y },
                    { x: rect.x + rect.width, y: rect.y },
                    { x: rect.x + rect.width, y: rect.y + rect.height },
                    { x: rect.x, y: rect.y + rect.height }
                  ];
                }

                points = orderQuad(points).map(point => ({
                  x: point.x / scale,
                  y: point.y / scale
                }));

                const score = quadScore(points, originalWidth, originalHeight);
                if (score > 0) output.push({ score, points });
              } finally {
                contour.delete();
              }
            }

            hierarchy.delete();
            contours.delete();
            merged.delete();
          }

          darkMask.delete();
        }
      }

      output.sort((a, b) => b.score - a.score);
      return dedupeQuads(output);
    } finally {
      for (let i = 0; i < channels.size(); i++) {
        const channel = channels.get(i);
        channel.delete();
      }
      channels.delete();
      gray.delete();
    }
  }

  function pointsFromContour(mat) {
    const data = mat.data32S?.length ? mat.data32S : mat.data32F;
    const points = [];
    for (let i = 0; i < data.length; i += 2) {
      points.push({ x: data[i], y: data[i + 1] });
    }
    return points;
  }

  function quadScore(points, width, height) {
    const ordered = orderQuad(points);
    const area = polygonArea(ordered);
    const total = width * height;

    if (area < total * 0.004 || area > total * 0.80) return -1;

    const lengths = ordered.map((point, index) =>
      distance(point, ordered[(index + 1) % 4])
    );

    if (Math.min(...lengths) < Math.max(24, Math.min(width, height) * 0.02)) {
      return -1;
    }

    const sideRatio = Math.max(...lengths) / Math.max(1, Math.min(...lengths));
    if (sideRatio > 2.1) return -1;

    const xs = ordered.map(p => p.x);
    const ys = ordered.map(p => p.y);
    const boxWidth = Math.max(...xs) - Math.min(...xs);
    const boxHeight = Math.max(...ys) - Math.min(...ys);
    const aspect = boxWidth / Math.max(1, boxHeight);
    if (aspect < 0.5 || aspect > 2.0) return -1;

    const margin = Math.max(4, Math.min(width, height) * 0.012);
    const touches =
      Number(Math.min(...xs) <= margin) +
      Number(Math.min(...ys) <= margin) +
      Number(Math.max(...xs) >= width - margin) +
      Number(Math.max(...ys) >= height - margin);

    const edgePenalty = touches >= 2 ? 0.12 : (touches === 1 ? 0.40 : 1);
    const areaRatio = area / total;
    const largePenalty = areaRatio > 0.48 ? 0.18 : (areaRatio > 0.32 ? 0.55 : 1);
    const squareFactor = 1 / sideRatio;
    const aspectFactor = Math.max(0.25, 1 - Math.abs(aspect - 1) * 0.45);

    return area * squareFactor * aspectFactor * edgePenalty * largePenalty;
  }

  function dedupeQuads(candidates) {
    const output = [];

    for (const candidate of candidates) {
      const center = averagePoint(candidate.points);
      const area = polygonArea(candidate.points);
      let duplicate = false;

      for (const old of output) {
        const oldCenter = averagePoint(old.points);
        const oldArea = polygonArea(old.points);
        const centerLimit = 0.13 * Math.sqrt(Math.max(area, oldArea));
        const similarArea =
          Math.min(area, oldArea) / Math.max(1, Math.max(area, oldArea)) > 0.58;

        if (distance(center, oldCenter) < centerLimit && similarArea) {
          duplicate = true;
          break;
        }
      }

      if (!duplicate) output.push(candidate);
    }

    return output;
  }

  function warpQuadOpenCv(src, points, size, expansion) {
    const cv = window.cv;
    const ordered = orderQuad(points);
    const center = averagePoint(ordered);
    const expanded = ordered.map(point => ({
      x: center.x + (point.x - center.x) * (1 + expansion),
      y: center.y + (point.y - center.y) * (1 + expansion)
    }));

    const srcPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
      expanded[0].x, expanded[0].y,
      expanded[1].x, expanded[1].y,
      expanded[2].x, expanded[2].y,
      expanded[3].x, expanded[3].y
    ]);

    const dstPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0,
      size - 1, 0,
      size - 1, size - 1,
      0, size - 1
    ]);

    const transform = cv.getPerspectiveTransform(srcPoints, dstPoints);
    const warped = new cv.Mat();

    cv.warpPerspective(
      src,
      warped,
      transform,
      new cv.Size(size, size),
      cv.INTER_CUBIC,
      cv.BORDER_CONSTANT,
      new cv.Scalar(255, 255, 255, 255)
    );

    transform.delete();
    srcPoints.delete();
    dstPoints.delete();
    return warped;
  }

  function createOpenCvVariants(warped) {
    const cv = window.cv;
    const gray = new cv.Mat();
    cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);

    const channels = new cv.MatVector();
    cv.split(warped, channels);
    const red = channels.get(0).clone();

    for (let i = 0; i < channels.size(); i++) {
      const channel = channels.get(i);
      channel.delete();
    }
    channels.delete();

    const claheGray = new cv.Mat();
    const claheRed = new cv.Mat();
    const clahe1 = new cv.CLAHE(2.0, new cv.Size(8, 8));
    const clahe2 = new cv.CLAHE(2.0, new cv.Size(8, 8));
    clahe1.apply(gray, claheGray);
    clahe2.apply(red, claheRed);
    clahe1.delete();
    clahe2.delete();

    const variants = [];
    addCvVariantGroup(variants, "灰度", gray, [130, 110, 150, 170, 190]);
    addCvVariantGroup(variants, "灰度增强", claheGray, [180, 160, 200, 140]);
    addCvVariantGroup(variants, "红通道", red, [120, 140, 160, 180]);
    addCvVariantGroup(variants, "红通道增强", claheRed, [160, 180, 140, 200]);

    gray.delete();
    claheGray.delete();
    red.delete();
    claheRed.delete();
    return variants;
  }

  function addCvVariantGroup(output, name, source, thresholds) {
    const cv = window.cv;
    output.push({ name: `${name}-原图`, mat: source.clone() });

    const otsu = new cv.Mat();
    cv.threshold(source, otsu, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
    output.push({ name: `${name}-Otsu`, mat: otsu });

    for (const threshold of thresholds) {
      const binary = new cv.Mat();
      cv.threshold(source, binary, threshold, 255, cv.THRESH_BINARY);
      output.push({ name: `${name}-阈值${threshold}`, mat: binary });
    }
  }

  function deleteOpenCvVariants(variants) {
    for (const variant of variants) {
      try { variant.mat.delete(); } catch (_) {}
    }
  }

  function matToBorderedImageData(mat, size) {
    const cv = window.cv;
    const border = Math.max(48, Math.round(size * 0.10));
    const bordered = new cv.Mat();
    const rgba = new cv.Mat();

    try {
      cv.copyMakeBorder(
        mat,
        bordered,
        border,
        border,
        border,
        border,
        cv.BORDER_CONSTANT,
        new cv.Scalar(255, 255, 255, 255)
      );

      if (bordered.channels() === 1) {
        cv.cvtColor(bordered, rgba, cv.COLOR_GRAY2RGBA);
      } else if (bordered.channels() === 3) {
        cv.cvtColor(bordered, rgba, cv.COLOR_RGB2RGBA);
      } else {
        bordered.copyTo(rgba);
      }

      return new ImageData(
        new Uint8ClampedArray(rgba.data),
        rgba.cols,
        rgba.rows
      );
    } finally {
      rgba.delete();
      bordered.delete();
    }
  }

  async function decodeCanvasWasm(canvas, stage, tryGlobal = false) {
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return decodeImageDataWasm(imageData, stage, tryGlobal);
  }

  async function decodeImageDataWasm(imageData, stage, tryGlobal = false) {
    await prewarmEngine();

    let results = await ZXingWASM.readBarcodes(imageData, ZXING_OPTIONS_LOCAL);
    let hit = bestResultHit(results, stage + " / LocalAverage");
    if (hit?.accepted || !tryGlobal) return hit;

    results = await ZXingWASM.readBarcodes(imageData, ZXING_OPTIONS_GLOBAL);
    const globalHit = bestResultHit(results, stage + " / GlobalHistogram");
    if (!hit || (globalHit && globalHit.score > hit.score)) hit = globalHit;
    return hit;
  }

  function bestResultHit(results, stage) {
    let best = null;

    for (const result of results || []) {
      if (!result || result.isValid === false || result.symbology !== "QRCode") {
        continue;
      }

      const text = decodeWasmResult(result).trim();
      if (!text) continue;

      const parsed = parseLooseJson(text);
      const score = qualityScore(text, parsed);
      const keyCount = parsed && typeof parsed === "object" && !Array.isArray(parsed)
        ? EXPECTED_KEYS.filter(key => Object.prototype.hasOwnProperty.call(parsed, key)).length
        : 0;

      const hit = {
        text,
        parsed,
        score,
        keyCount,
        accepted: keyCount >= 2 || score >= 520,
        stage,
        engine: "ZXing-C++ WebAssembly"
      };

      if (!best || hit.score > best.score) best = hit;
    }

    return best;
  }

  function decodeWasmResult(result) {
    const candidates = [];
    const bytes = result.bytes instanceof Uint8Array
      ? result.bytes
      : new Uint8Array(result.bytes || []);

    addDecodedByteCandidates(candidates, bytes, [
      "utf-8", "gb18030", "gbk", "big5", "shift_jis", "iso-8859-1"
    ]);

    if (result.text) {
      candidates.push({ text: result.text, score: scoreText(result.text) });

      const restored = legacyMojibakeToBytes(result.text);
      if (restored) {
        addDecodedByteCandidates(candidates, restored, [
          "gb18030", "gbk", "utf-8", "big5"
        ]);
      }
    }

    if (!candidates.length) return result.text || "";
    candidates.sort((a, b) => b.score - a.score);
    return candidates[0].text;
  }

  function addDecodedByteCandidates(output, bytes, encodings) {
    if (!bytes?.length) return;

    let end = bytes.length;
    while (end > 0 && bytes[end - 1] === 0) end--;
    const clean = end === bytes.length ? bytes : bytes.slice(0, end);

    for (const encoding of encodings) {
      try {
        const text = new TextDecoder(encoding, { fatal: true }).decode(clean);
        output.push({ text, score: scoreText(text) });
      } catch (_) {}
    }
  }

  function qualityScore(text, parsed) {
    let score = Math.min(text.length, 120);
    if (parsed !== null) score += 220;

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      score += EXPECTED_KEYS.filter(
        key => Object.prototype.hasOwnProperty.call(parsed, key)
      ).length * 70;
    }

    score += scoreText(text);
    return score;
  }

  function scoreText(text) {
    let score = 0;
    let chinese = 0;
    let printable = 0;
    let controls = 0;

    for (const char of text) {
      const code = char.codePointAt(0);
      if (code >= 0x4e00 && code <= 0x9fff) chinese++;
      if (char === "\n" || char === "\r" || char === "\t" || code >= 32) {
        printable++;
      } else {
        controls++;
      }
    }

    score += printable + chinese * 5 - controls * 25;
    if (/^\s*[\{\[]/.test(text)) score += 80;

    for (const key of EXPECTED_KEYS) {
      if (text.includes(key)) score += 100;
    }

    for (const token of ["Ã", "Â", "¤", "×", "º", "Ê", "Ö", "Ï", "Ð", "�"]) {
      score -= (text.split(token).length - 1) * 15;
    }

    return score;
  }

  function legacyMojibakeToBytes(text) {
    const reverse = new Map([
      [0x20AC, 0x80], [0x201A, 0x82], [0x0192, 0x83],
      [0x201E, 0x84], [0x2026, 0x85], [0x2020, 0x86],
      [0x2021, 0x87], [0x02C6, 0x88], [0x2030, 0x89],
      [0x0160, 0x8A], [0x2039, 0x8B], [0x0152, 0x8C],
      [0x017D, 0x8E], [0x2018, 0x91], [0x2019, 0x92],
      [0x201C, 0x93], [0x201D, 0x94], [0x2022, 0x95],
      [0x2013, 0x96], [0x2014, 0x97], [0x02DC, 0x98],
      [0x2122, 0x99], [0x0161, 0x9A], [0x203A, 0x9B],
      [0x0153, 0x9C], [0x017E, 0x9E], [0x0178, 0x9F]
    ]);

    const bytes = [];
    for (const char of text) {
      const code = char.codePointAt(0);
      if (code <= 0xff) bytes.push(code);
      else if (reverse.has(code)) bytes.push(reverse.get(code));
      else return null;
    }
    return new Uint8Array(bytes);
  }

  function parseLooseJson(text) {
    let fixed = text.trim().replace(/^\uFEFF/, "");
    if (!fixed.startsWith("{")) return null;

    fixed = fixed
      .replace(/(^|[,:{\[]\s*)NULL(?=\s*[,}\]])/gi, "$1null")
      .replace(/(^|[,:{\[]\s*)TRUE(?=\s*[,}\]])/gi, "$1true")
      .replace(/(^|[,:{\[]\s*)FALSE(?=\s*[,}\]])/gi, "$1false");

    try {
      return JSON.parse(fixed);
    } catch (_) {
      return null;
    }
  }

  function captureVideoFrame(maxEdge) {
    const scale = Math.min(
      1,
      maxEdge / Math.max(video.videoWidth, video.videoHeight)
    );
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );
    return canvas;
  }

  function centerSquareCrop(source, fraction, maxEdge) {
    const side = Math.round(Math.min(source.width, source.height) * fraction);
    const rect = {
      x: Math.round((source.width - side) / 2),
      y: Math.round((source.height - side) / 2),
      w: side,
      h: side
    };
    return cropCanvas(source, rect, maxEdge);
  }

  function buildFastVariants(source, count) {
    const variants = [{ name: "原图", canvas: cloneCanvas(source) }];
    const red = channelCanvas(source, "red");
    const redContrast = autoContrastCanvas(red);
    red.width = 1;
    red.height = 1;

    variants.push({ name: "红通道增强", canvas: redContrast });

    if (count % 2 === 0) {
      variants.push({
        name: "红通道阈值160",
        canvas: thresholdCanvas(redContrast, 160)
      });
    }
    return variants;
  }

  function buildGalleryVariants(source) {
    const original = cloneCanvas(source);
    const gray = channelCanvas(source, "gray");
    const red = channelCanvas(source, "red");
    const grayContrast = autoContrastCanvas(gray);
    const redContrast = autoContrastCanvas(red);

    return [
      { name: "原图", canvas: original },
      { name: "灰度", canvas: gray },
      { name: "红通道", canvas: red },
      { name: "灰度增强", canvas: grayContrast },
      { name: "红通道增强", canvas: redContrast },
      { name: "灰度Otsu", canvas: thresholdCanvas(grayContrast, otsuCanvas(grayContrast)) },
      { name: "红通道Otsu", canvas: thresholdCanvas(redContrast, otsuCanvas(redContrast)) },
      { name: "红通道阈值120", canvas: thresholdCanvas(redContrast, 120) },
      { name: "红通道阈值160", canvas: thresholdCanvas(redContrast, 160) },
      { name: "灰度增强阈值180", canvas: thresholdCanvas(grayContrast, 180) }
    ];
  }

  function findCandidateRects(sourceCanvas) {
    const width = sourceCanvas.width;
    const height = sourceCanvas.height;
    const candidates = [
      { x: 0, y: 0, w: width, h: height, score: 100000 },
      rectByRatio(width, height, .05, .15, .95, .95, 9000),
      rectByRatio(width, height, .08, .30, .92, .99, 8500),
      rectByRatio(width, height, .08, .03, .92, .74, 8000)
    ];

    const search = scaleCanvas(sourceCanvas, 520);
    const ctx = search.getContext("2d", { willReadFrequently: true });
    const image = ctx.getImageData(0, 0, search.width, search.height);
    const pixels = image.data;
    const count = search.width * search.height;
    const red = new Uint8Array(count);
    const histogram = new Uint32Array(256);

    for (let i = 0, p = 0; i < pixels.length; i += 4, p++) {
      red[p] = pixels[i];
      histogram[red[p]]++;
    }

    const threshold = otsuFromHistogram(histogram, count);
    const dark = new Uint8Array(count);
    for (let i = 0; i < count; i++) dark[i] = red[i] < threshold ? 1 : 0;

    const sw = search.width;
    const sh = search.height;
    const stride = sw + 1;
    const darkIntegral = new Uint32Array((sw + 1) * (sh + 1));
    const transitionIntegral = new Uint32Array((sw + 1) * (sh + 1));

    for (let y = 0; y < sh; y++) {
      let rowDark = 0;
      let rowTransition = 0;

      for (let x = 0; x < sw; x++) {
        const index = y * sw + x;
        rowDark += dark[index];

        let transition = 0;
        if (x > 0 && dark[index] !== dark[index - 1]) transition = 1;
        if (y > 0 && dark[index] !== dark[index - sw]) transition = 1;
        rowTransition += transition;

        const ii = (y + 1) * stride + x + 1;
        darkIntegral[ii] = darkIntegral[y * stride + x + 1] + rowDark;
        transitionIntegral[ii] =
          transitionIntegral[y * stride + x + 1] + rowTransition;
      }
    }

    const minDim = Math.min(sw, sh);
    for (const percent of [18, 22, 27, 33, 40, 48, 58, 68]) {
      const size = Math.max(68, Math.round(minDim * percent / 100));
      const step = Math.max(11, Math.round(size / 7));

      for (let y = 0; y + size <= sh; y += step) {
        for (let x = 0; x + size <= sw; x += step) {
          const area = size * size;
          const darkCount = sumIntegral(
            darkIntegral, stride, x, y, x + size, y + size
          );
          const transitions = sumIntegral(
            transitionIntegral, stride, x, y, x + size, y + size
          );
          const density = darkCount / area;
          const transitionDensity = transitions / area;

          if (density < .15 || density > .78 || transitionDensity < .052) {
            continue;
          }

          const densityScore =
            1 - Math.min(1, Math.abs(density - .44) / .44);
          const score =
            transitionDensity * 7000 + densityScore * 850 + size * .2;
          const scaleX = width / sw;
          const scaleY = height / sh;

          candidates.push(expandRect({
            x: Math.round(x * scaleX),
            y: Math.round(y * scaleY),
            w: Math.round(size * scaleX),
            h: Math.round(size * scaleY),
            score
          }, width, height, .14));
        }
      }
    }

    search.width = 1;
    search.height = 1;
    candidates.sort((a, b) => b.score - a.score);

    const selected = [];
    for (const candidate of candidates) {
      if (selected.some(old => intersectionOverUnion(candidate, old) > .64)) {
        continue;
      }
      selected.push(candidate);
      if (selected.length >= 12) break;
    }
    return selected;
  }

  function estimateSharpness(canvas) {
    const small = scaleCanvas(canvas, 320);
    const ctx = small.getContext("2d", { willReadFrequently: true });
    const data = ctx.getImageData(0, 0, small.width, small.height).data;
    const gray = new Float32Array(small.width * small.height);

    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      gray[p] = data[i] * .299 + data[i + 1] * .587 + data[i + 2] * .114;
    }

    let sum = 0;
    let sumSquares = 0;
    let count = 0;

    for (let y = 1; y < small.height - 1; y++) {
      for (let x = 1; x < small.width - 1; x++) {
        const i = y * small.width + x;
        const laplacian =
          gray[i - 1] + gray[i + 1] +
          gray[i - small.width] + gray[i + small.width] -
          4 * gray[i];

        sum += laplacian;
        sumSquares += laplacian * laplacian;
        count++;
      }
    }

    small.width = 1;
    small.height = 1;
    if (!count) return 0;
    const mean = sum / count;
    return sumSquares / count - mean * mean;
  }

  function cloneCanvas(source) {
    const canvas = document.createElement("canvas");
    canvas.width = source.width;
    canvas.height = source.height;
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(source, 0, 0);
    return canvas;
  }

  function scaleCanvas(source, maxEdge) {
    const scale = Math.min(1, maxEdge / Math.max(source.width, source.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(source.width * scale));
    canvas.height = Math.max(1, Math.round(source.height * scale));
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(
      source,
      0,
      0,
      canvas.width,
      canvas.height
    );
    return canvas;
  }

  function cropCanvas(source, rect, maxEdge) {
    const scale = Math.min(1, maxEdge / Math.max(rect.w, rect.h));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(rect.w * scale));
    canvas.height = Math.max(1, Math.round(rect.h * scale));
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(
      source,
      rect.x, rect.y, rect.w, rect.h,
      0, 0, canvas.width, canvas.height
    );
    return canvas;
  }

  function channelCanvas(source, mode) {
    const canvas = cloneCanvas(source);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;

    for (let i = 0; i < data.length; i += 4) {
      const value = mode === "red"
        ? data[i]
        : Math.round(data[i] * .299 + data[i + 1] * .587 + data[i + 2] * .114);

      data[i] = value;
      data[i + 1] = value;
      data[i + 2] = value;
    }

    ctx.putImageData(image, 0, 0);
    return canvas;
  }

  function autoContrastCanvas(source) {
    const canvas = cloneCanvas(source);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;
    const histogram = new Uint32Array(256);

    for (let i = 0; i < data.length; i += 4) histogram[data[i]]++;

    const total = canvas.width * canvas.height;
    const lowTarget = Math.max(1, Math.round(total * .02));
    const highTarget = Math.max(1, Math.round(total * .98));
    let cumulative = 0;
    let low = 0;
    let high = 255;

    for (let i = 0; i < 256; i++) {
      cumulative += histogram[i];
      if (cumulative >= lowTarget) {
        low = i;
        break;
      }
    }

    cumulative = 0;
    for (let i = 0; i < 256; i++) {
      cumulative += histogram[i];
      if (cumulative >= highTarget) {
        high = i;
        break;
      }
    }

    if (high > low + 8) {
      for (let i = 0; i < data.length; i += 4) {
        const value = Math.max(
          0,
          Math.min(255, Math.round((data[i] - low) * 255 / (high - low)))
        );
        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;
      }
      ctx.putImageData(image, 0, 0);
    }

    return canvas;
  }

  function thresholdCanvas(source, threshold) {
    const canvas = cloneCanvas(source);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;

    for (let i = 0; i < data.length; i += 4) {
      const value = data[i] < threshold ? 0 : 255;
      data[i] = value;
      data[i + 1] = value;
      data[i + 2] = value;
    }

    ctx.putImageData(image, 0, 0);
    return canvas;
  }

  function otsuCanvas(canvas) {
    const data = canvas.getContext("2d", { willReadFrequently: true })
      .getImageData(0, 0, canvas.width, canvas.height).data;
    const histogram = new Uint32Array(256);

    for (let i = 0; i < data.length; i += 4) histogram[data[i]]++;
    return otsuFromHistogram(histogram, canvas.width * canvas.height);
  }

  function otsuFromHistogram(histogram, total) {
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * histogram[i];

    let sumBackground = 0;
    let weightBackground = 0;
    let bestVariance = -1;
    let bestThreshold = 128;

    for (let threshold = 0; threshold < 256; threshold++) {
      weightBackground += histogram[threshold];
      if (!weightBackground) continue;

      const weightForeground = total - weightBackground;
      if (!weightForeground) break;

      sumBackground += threshold * histogram[threshold];
      const meanBackground = sumBackground / weightBackground;
      const meanForeground = (sum - sumBackground) / weightForeground;
      const difference = meanBackground - meanForeground;
      const variance =
        weightBackground * weightForeground * difference * difference;

      if (variance > bestVariance) {
        bestVariance = variance;
        bestThreshold = threshold;
      }
    }

    return bestThreshold;
  }

  function rectByRatio(width, height, left, top, right, bottom, score) {
    return {
      x: Math.round(width * left),
      y: Math.round(height * top),
      w: Math.round(width * (right - left)),
      h: Math.round(height * (bottom - top)),
      score
    };
  }

  function expandRect(rect, maxWidth, maxHeight, fraction) {
    const dx = Math.round(rect.w * fraction);
    const dy = Math.round(rect.h * fraction);
    const x = Math.max(0, rect.x - dx);
    const y = Math.max(0, rect.y - dy);
    const right = Math.min(maxWidth, rect.x + rect.w + dx);
    const bottom = Math.min(maxHeight, rect.y + rect.h + dy);

    return {
      x,
      y,
      w: Math.max(1, right - x),
      h: Math.max(1, bottom - y),
      score: rect.score
    };
  }

  function intersectionOverUnion(a, b) {
    const left = Math.max(a.x, b.x);
    const top = Math.max(a.y, b.y);
    const right = Math.min(a.x + a.w, b.x + b.w);
    const bottom = Math.min(a.y + a.h, b.y + b.h);
    const intersection =
      Math.max(0, right - left) * Math.max(0, bottom - top);
    const union = a.w * a.h + b.w * b.h - intersection;
    return union <= 0 ? 0 : intersection / union;
  }

  function sumIntegral(integral, stride, left, top, right, bottom) {
    return integral[bottom * stride + right]
      - integral[top * stride + right]
      - integral[bottom * stride + left]
      + integral[top * stride + left];
  }

  function orderQuad(points) {
    const sorted = [...points].sort((a, b) => (a.x + a.y) - (b.x + b.y));
    const topLeft = sorted[0];
    const bottomRight = sorted[sorted.length - 1];
    const remaining = points.filter(
      point => point !== topLeft && point !== bottomRight
    );

    const topRight = remaining.reduce(
      (best, point) => (point.x - point.y) > (best.x - best.y) ? point : best
    );
    const bottomLeft = remaining.find(point => point !== topRight) || remaining[0];

    return [topLeft, topRight, bottomRight, bottomLeft];
  }

  function polygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
      const j = (i + 1) % points.length;
      area += points[i].x * points[j].y - points[j].x * points[i].y;
    }
    return Math.abs(area) / 2;
  }

  function averagePoint(points) {
    return {
      x: points.reduce((sum, point) => sum + point.x, 0) / points.length,
      y: points.reduce((sum, point) => sum + point.y, 0) / points.length
    };
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function isExpired(started, limit, token) {
    return token !== abortToken || performance.now() - started > limit;
  }

  function recycleVariantList(variants) {
    for (const variant of variants) {
      variant.canvas.width = 1;
      variant.canvas.height = 1;
    }
  }

  function breathe() {
    return new Promise(resolve =>
      requestAnimationFrame(() => setTimeout(resolve, 0))
    );
  }

  async function deepCurrentFrame() {
    if (!cameraStream || !video.videoWidth || frameBusy) {
      setStatus("请先启动摄像头，再点击“立即深度识别”。", "warn");
      return;
    }

    frameBusy = true;
    scanning = false;
    if (scanTimer) clearTimeout(scanTimer);
    clearBestFrame();
    bestFrameCanvas = captureVideoFrame(3400);
    bestSharpness = estimateSharpness(bestFrameCanvas);
    const token = abortToken;

    setStatus("已抓取当前高清画面，正在深度识别……");
    cameraState.textContent = "正在深度识别";

    try {
      await runDeepOnBestFrame(token, false);
    } finally {
      frameBusy = false;
    }
  }

  async function onFileSelected(event) {
    const file = event.target.files?.[0];
    fileInput.value = "";
    if (!file) return;

    abortToken++;
    const token = abortToken;
    stopCamera(false);
    closeOutcome();
    setProgress(true, 2, "读取相册原图");
    setStatus("正在读取相册原图并启动C++深度识别……");
    cameraState.textContent = "正在识别相册图片";

    try {
      await prewarmEngine();
      const bitmap = await loadImage(file);
      const canvas = drawSourceToCanvas(bitmap, 3800);

      if (bitmap.close) bitmap.close();

      const previewUrl = URL.createObjectURL(file);
      previewImage.onload = () => URL.revokeObjectURL(previewUrl);
      previewImage.src = previewUrl;
      previewImage.style.display = "block";
      video.style.display = "none";

      const hit = await deepDecodeCanvas(canvas, token);
      canvas.width = 1;
      canvas.height = 1;
      setProgress(false);

      if (token !== abortToken) return;

      if (hit?.accepted) {
        completeSuccess(hit, "相册深度识别");
      } else {
        showFailureOutcome(
          "相册图片没有读到完整生产单二维码。请尽量选择原始照片，或先裁剪到二维码附近再试。"
        );
      }
    } catch (error) {
      setProgress(false);
      showFailureOutcome("相册识别失败：" + safeMessage(error));
    }
  }

  function loadImage(file) {
    if ("createImageBitmap" in window) {
      return createImageBitmap(file, { imageOrientation: "from-image" })
        .catch(() => createImageBitmap(file));
    }

    return new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = () => {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("无法读取图片"));
      };
      image.src = url;
    });
  }

  function drawSourceToCanvas(source, maxEdge) {
    const width = source.width || source.naturalWidth;
    const height = source.height || source.naturalHeight;
    const scale = Math.min(1, maxEdge / Math.max(width, height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    canvas.getContext("2d", { willReadFrequently: true }).drawImage(
      source,
      0,
      0,
      canvas.width,
      canvas.height
    );
    return canvas;
  }

  function completeSuccess(hit, source) {
    // Scanning always stops after one accepted result, so an additional
    // duplicate filter is unnecessary. The old filter caused iPhone Safari to
    // appear frozen after “继续扫描” when the previous QR was still in view.
    abortToken++;
    stopCamera(false);

    lastDecodedText = hit.text;
    lastDecodedAt = Date.now();

    renderResult(hit.text);
    setProgress(false);
    setStatus(`${source}成功：${hit.stage}`, "good");
    cameraState.textContent = "识别成功";
    continueButton.disabled = false;
    showSuccessOutcome(hit, source);

    if (navigator.vibrate) {
      try { navigator.vibrate([70, 45, 90]); } catch (_) {}
    }
  }

  function renderResult(text) {
    rawText.textContent = text;
    rows.innerHTML = "";

    const parsed = parseLooseJson(text);
    const copyLines = [];

    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const key of EXPECTED_KEYS) {
        const value = displayValue(parsed[key]);
        addRow(rows, key, value);
        copyLines.push(`${key}：${value}`);
      }

      for (const [key, rawValue] of Object.entries(parsed)) {
        if (EXPECTED_KEYS.includes(key)) continue;
        const value = displayValue(rawValue);
        addRow(rows, key, value);
        copyLines.push(`${key}：${value}`);
      }
    } else {
      addRow(rows, "解析结果", text);
      copyLines.push(text);
    }

    currentCopyText =
      copyLines.join("\n") + "\n\n二维码原始内容：\n" + text;
  }

  function showSuccessOutcome(hit, source) {
    outcomeCard.className = "outcome-card success";
    resultOverlay.className = "result-overlay show";
    resultOverlay.setAttribute("aria-hidden", "false");
    outcomeIcon.textContent = "✓";
    outcomeTitle.textContent = "识别成功";
    outcomeMessage.textContent = `${source} · ${hit.engine} · ${hit.stage}`;
    outcomeRawTitle.classList.remove("hidden");
    outcomeRaw.classList.remove("hidden");
    outcomeRaw.textContent = hit.text;
    outcomeCopyButton.classList.remove("hidden");
    outcomeRows.innerHTML = "";

    const parsed = parseLooseJson(hit.text);
    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
      for (const key of EXPECTED_KEYS) {
        addRow(outcomeRows, key, displayValue(parsed[key]));
      }
    } else {
      addRow(outcomeRows, "解析结果", hit.text);
    }

    document.body.classList.add("modal-open");
    window.scrollTo(0, 0);
  }

  function showFailureOutcome(message) {
    abortToken++;
    stopCamera(false);
    setProgress(false);
    outcomeCard.className = "outcome-card failure";
    resultOverlay.className = "result-overlay show";
    resultOverlay.setAttribute("aria-hidden", "false");
    outcomeIcon.textContent = "×";
    outcomeTitle.textContent = "本轮没有识别到";
    outcomeMessage.textContent = message;
    outcomeRows.innerHTML = "";
    addRow(outcomeRows, "结果", "没有得到完整生产单二维码内容");
    addRow(outcomeRows, "操作", "靠近一点、保持正对、等待对焦，再点击继续扫描");
    outcomeRawTitle.classList.add("hidden");
    outcomeRaw.classList.add("hidden");
    outcomeCopyButton.classList.add("hidden");
    document.body.classList.add("modal-open");

    if (navigator.vibrate) {
      try { navigator.vibrate(120); } catch (_) {}
    }
  }

  function addRow(container, field, value) {
    const row = document.createElement("div");
    row.className = "row";

    const fieldElement = document.createElement("div");
    fieldElement.className = "field";
    fieldElement.textContent = field;

    const valueElement = document.createElement("div");
    valueElement.className = "value";
    valueElement.textContent = value;

    row.append(fieldElement, valueElement);
    container.appendChild(row);
  }

  function displayValue(value) {
    if (value === null || value === undefined || value === "") return "空";
    if (typeof value === "object") {
      try { return JSON.stringify(value, null, 2); } catch (_) {}
    }
    return String(value);
  }

  function closeOutcome() {
    resultOverlay.className = "result-overlay";
    resultOverlay.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
  }

  function continueFromOutcome() {
    if (cameraStarting) return;

    closeOutcome();
    clearBestFrame();

    // A new scan is an explicit new session. Clear the previous-code guard so
    // the same physical label can also be scanned again deliberately.
    lastDecodedText = "";
    lastDecodedAt = 0;

    cameraState.textContent = "正在重新启动摄像头";
    setStatus("正在准备下一次扫描……");

    // Give iPhone Safari a brief moment to release the previous camera track.
    // Starting immediately after track.stop() can occasionally leave the new
    // getUserMedia request waiting indefinitely.
    setTimeout(() => {
      startCamera();
    }, 220);
  }

  function showWaiting() {
    rows.innerHTML = "";
    addRow(rows, "状态", "等待扫描二维码");
  }

  async function copyResult() {
    if (!currentCopyText) {
      setStatus("目前没有可复制的结果。", "warn");
      return;
    }

    try {
      await navigator.clipboard.writeText(currentCopyText);
      setStatus("结果已复制。", "good");
    } catch (_) {
      const area = document.createElement("textarea");
      area.value = currentCopyText;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      setStatus("结果已复制。", "good");
    }
  }

  function clearResult() {
    abortToken++;
    stopCamera(false);
    closeOutcome();
    clearBestFrame();
    currentCopyText = "";
    lastDecodedText = "";
    rawText.textContent = "等待扫描……";
    showWaiting();
    setProgress(false);
    setStatus("结果已清空。");
    continueButton.disabled = true;
  }

  function stopCamera(updateStatus = true) {
    scanning = false;
    frameBusy = false;
    torchOn = false;

    if (scanTimer) {
      clearTimeout(scanTimer);
      scanTimer = null;
    }

    if (cameraStream) {
      for (const track of cameraStream.getTracks()) {
        try { track.stop(); } catch (_) {}
      }
      cameraStream = null;
    }

    video.srcObject = null;
    cameraTrack = null;
    updateCameraButtons(false);
    torchButton.textContent = "手电筒";

    if (updateStatus) {
      cameraState.textContent = "摄像头已停止";
      setStatus("摄像头已停止。");
    }
  }

  function updateCameraButtons(running) {
    startButton.disabled = running;
    stopButton.disabled = !running;
    deepButton.disabled = !running;
    if (!running) torchButton.disabled = true;
  }

  function updateTorchAvailability() {
    let supported = false;
    try {
      supported = !!cameraTrack?.getCapabilities?.().torch;
    } catch (_) {}
    torchButton.disabled = !supported;
  }

  async function toggleTorch() {
    if (!cameraTrack?.applyConstraints) {
      setStatus("当前浏览器不支持控制手电筒。", "warn");
      return;
    }

    try {
      torchOn = !torchOn;
      await cameraTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchButton.textContent = torchOn ? "关闭手电筒" : "手电筒";
    } catch (error) {
      torchOn = false;
      torchButton.textContent = "手电筒";
      setStatus("手电筒开启失败：" + safeMessage(error), "warn");
    }
  }

  function clearBestFrame() {
    if (bestFrameCanvas) {
      bestFrameCanvas.width = 1;
      bestFrameCanvas.height = 1;
      bestFrameCanvas = null;
    }
    bestSharpness = -1;
  }

  function cameraErrorText(error) {
    const name = error?.name || "";
    if (name === "NotAllowedError") {
      return "没有摄像头权限，请在Safari网站设置中允许摄像头。";
    }
    if (name === "NotFoundError") return "没有找到可用摄像头。";
    if (name === "NotReadableError") return "摄像头可能被其他程序占用。";
    return "摄像头启动失败：" + safeMessage(error);
  }

  function safeMessage(error) {
    return error?.message || error?.name || String(error);
  }

  startButton.addEventListener("click", startCamera);
  stopButton.addEventListener("click", () => stopCamera(true));
  deepButton.addEventListener("click", deepCurrentFrame);
  torchButton.addEventListener("click", toggleTorch);
  fileInput.addEventListener("change", onFileSelected);
  copyButton.addEventListener("click", copyResult);
  clearButton.addEventListener("click", clearResult);
  continueButton.addEventListener("click", continueFromOutcome);

  outcomeCopyButton.addEventListener("click", copyResult);
  outcomeCloseButton.addEventListener("click", closeOutcome);
  outcomeContinueButton.addEventListener("click", continueFromOutcome);

  resultOverlay.addEventListener("click", event => {
    if (event.target === resultOverlay) closeOutcome();
  });

  window.addEventListener("pagehide", () => {
    abortToken++;
    stopCamera(false);
  });

  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register(
        "./service-worker.js?v=0.8",
        { updateViaCache: "none" }
      ).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
